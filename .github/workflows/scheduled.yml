# Daily health check — "does the world still look like we think?"
#
# Same pipeline as ci.yml (scripts/run_pipeline.sh, one definition), different
# question. ci.yml asks whether a CHANGE works; this asks whether the pipeline
# still works when nothing changed — which is only interesting because it makes a
# REAL API CALL. It is what catches the API changing shape, the key expiring, or a
# distributional guard starting to fire, on a day when nobody is looking.
#
# It is a health check that ALSO SERVES (M9 Part B). Until Part B this cron threw
# its warehouse away (§5 — CI proves, laptop serves); now it builds into MotherDuck
# (DBT_DUCKDB_PATH=md:dogs), so the same run that proves the pipeline also refreshes
# the durable store the hosted dashboard reads. This is the ONE workflow that writes
# cloud: ci.yml (PRs) still builds a throwaway LOCAL warehouse and never needs the
# token, so a PR can never clobber last night's served gold. What made this a
# one-line change: the pipeline still rebuilds from the API (§1, stateless) — only
# the OUTPUT path moved from a discarded file to a persistent connection string, so
# gold + Elementary's run-history tables now accumulate night over night for free.
#
# Kept as its own workflow, not a second trigger on ci.yml, so this red is
# distinguishable from a broken PR at a glance. They fail for different reasons
# and want different reactions.

name: Scheduled pipeline

on:
  schedule:
    # 02:00 UTC daily. Actions cron is best-effort and can lag under load — fine
    # for a health check on a source that changes ~never. One daily job is also
    # the entire reason there's no Airflow here (DECISIONS.md §6).
    - cron: '0 2 * * *'
  # So the cron can be exercised on demand instead of waiting until 02:00 —
  # otherwise the only way to test a change to it is to wait a day.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: ingest + dbt build + test (live API)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # One env var, two programs. See ci.yml / SPEC.md "dbt targets". Unlike ci.yml,
      # this points at MotherDuck: the same run_pipeline.sh routes an md: path to the
      # cloud store instead of a local file (M9 Part B). ingest.py writes raw there,
      # dbt builds gold + Elementary there, and it persists past the VM — the durable
      # store the hosted dashboard reads.
      # M10 (Write-Audit-Publish): because DBT_DUCKDB_PATH is an `md:` path, run_pipeline.sh builds the
      # gold marts into a SHADOW schema (main_marts_next), runs all 39 tests there, and only on full
      # success atomically swaps it into live main_marts — all inside the pipeline step below. A failed
      # test never leaves torn/stale gold live. Nothing extra to set here: atomicity follows from the
      # md: destination, so a hand-run `DBT_DUCKDB_PATH=md:dogs ./run_pipeline.sh` is atomic too.
      DBT_DUCKDB_PATH: md:dogs
      DBT_TARGET: prod
      # Dead-man's-switch ping URL (Healthchecks.io). A SECRET like the others — anyone
      # holding the URL can forge a "healthy" ping and keep the monitor falsely green, so
      # it never appears literally in this file (same discipline as DOG_API_KEY /
      # MOTHERDUCK_TOKEN). At the JOB level so the `if:` gates below can read it; empty
      # when the secret is unset, and every ping step no-ops on that check, so the whole
      # heartbeat is inert until the secret exists.
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}

    steps:
      # Dead-man's-switch, signal 1/3 — START. Fires before anything runs, so Healthchecks
      # can also MEASURE run duration (start -> success). `|| true`: a monitoring ping must
      # never turn a healthy run red. `if:` overrides the default success() so it runs
      # first regardless; the env check makes it a no-op until the secret is set.
      - name: Heartbeat (start)
        if: env.HEALTHCHECKS_URL != ''
        run: curl -fsS -m 10 --retry 5 "$HEALTHCHECKS_URL/start" || true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The whole pipeline, Write-Audit-Publish and all: ingest raw into md:dogs, build gold into the
      # shadow schema + run all 39 tests, then (because the destination is md:) atomically swap the
      # validated shadow into live main_marts. raw + Elementary append directly (history/trends, even a
      # failed run records itself). If any test — or the swap — fails, this step exits non-zero, live
      # main_marts stays yesterday's, and no success heartbeat pings → the dead man's switch fires.
      - name: Run the pipeline (ingest, build, atomic publish)
        env:
          # Without this the cron 403s every night. Repo Settings > Secrets and
          # variables > Actions > New repository secret.
          DOG_API_KEY: ${{ secrets.DOG_API_KEY }}
          # The cron writes to md:dogs, so it needs the MotherDuck token (same secrets mechanism as
          # DOG_API_KEY) — for both the build and the publish swap. ci.yml does NOT set this; its local
          # build never touches the cloud. DuckDB reads MOTHERDUCK_TOKEN from the env for md: paths.
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: ./scripts/run_pipeline.sh

      # The distributional guards (warn) are the reason this cron is worth having:
      # they are how "the data quietly degraded" becomes visible without failing a
      # legitimate run. They only reach a human if this step runs. DECISIONS.md §3.
      - name: Surface dbt warnings
        if: always()
        run: python scripts/annotate_warns.py

      # Dead-man's-switch, signal 2/3 — SUCCESS. ONLY on a fully-green run (if: success()).
      # This gate is load-bearing: pinging unconditionally (if: always()) would let a
      # FAILED run report "alive" and keep the monitor green while the pipeline is broken —
      # a switch that lies. On failure this step is SKIPPED, so no success ping arrives and
      # the monitor eventually alarms; the fail ping below makes that immediate.
      - name: Heartbeat (success)
        if: success() && env.HEALTHCHECKS_URL != ''
        run: curl -fsS -m 10 --retry 5 "$HEALTHCHECKS_URL" || true

      # Dead-man's-switch, signal 3/3 — FAIL. Explicit failure signal on any failed step,
      # so the monitor alarms at once instead of waiting for the missing success ping to
      # time out. Three signals, same effort as one: missing-run detection + measured
      # duration + an explicit fail.
      - name: Heartbeat (fail)
        if: failure() && env.HEALTHCHECKS_URL != ''
        run: curl -fsS -m 10 --retry 5 "$HEALTHCHECKS_URL/fail" || true

      # No artifact upload needed: persistence is the POINT now, but it lives in
      # MotherDuck (written during the build), not in a GitHub artifact. The VM is
      # still discarded — it was only ever the compute; the store is remote. See the
      # header, and DECISIONS.md §5 (Part B updated the serving half).
      #
      # ADDRESSED (was a known gap): a failed OR MISSED scheduled run used to be visible
      # only on the Actions page — and a run GitHub silently DROPS (or auto-disables after
      # 60 days of repo inactivity) left no trace at all. The heartbeat above closes both:
      # Healthchecks expects a daily success ping and alarms if none arrives, so a missed
      # run is now detectable, which the Actions page structurally cannot show. Grace is
      # tuned WIDE (a few hours) on purpose: GitHub cron is routinely 15-30 min late and
      # that is normal, not a miss — a tight window would cry wolf, and a flaky alert gets
      # muted (the DECISIONS "wallpaper" rule applied to paging). See DECISIONS.md §6.
