version: 2

seeds:
  - name: size_class_bands
    description: >
      THE ONLY HOME of the size_class boundaries (5 / 12 / 25 / 45 kg). They are DATA, not
      code — so they live in a seed, get tested like data, and can be changed without
      touching a model. Frozen in M0.5 against the real weight distribution.

      Intervals are HALF-OPEN [min_kg, max_kg): lower inclusive, upper EXCLUSIVE. The join
      predicate is literal, so there is no room for interpretation:
          weight_mid_kg >= min_kg AND weight_mid_kg < max_kg
      Consequences, stated so nobody re-derives them: 45.0 kg is `giant` (not large),
      25.0 kg is `large` (not medium), 5.0 kg is `small` (not toy).

      This is NOT pedantry — 31 breeds (5%) sit EXACTLY on a boundary, 23 of them on 25 kg.
      `pd.cut` defaults to the OPPOSITE (right-closed) convention, which is precisely how
      the M0.5 explorer and a SQL prototype came to disagree by 2 breeds. Any Python
      reproducing these numbers must pass right=False.

      'unknown' is deliberately NOT here: a label with no range has no business in a range
      table. The null case is an explicit CASE branch in dim_breeds, before the join.

    columns:
      - name: label
        description: toy | small | medium | large | giant. The five real bands, no 'unknown'.
        data_tests:
          - unique
          - not_null
      - name: min_kg
        description: INCLUSIVE lower bound.
        data_tests:
          - not_null
      - name: max_kg
        description: EXCLUSIVE upper bound. 999 on `giant` is a sentinel for "no ceiling".
        data_tests:
          - not_null

  - name: dashboard_temperament_tags
    description: >
      CONFIG, not data: the curated set + order of temperament tags the dashboard's
      temperament HEATMAP (DASHBOARD.md §D) plots. Same playbook as size_class_bands —
      a hand-chosen constant that steers a chart, lifted out of an app literal into a
      seed so it's reviewable in the repo and read by the app instead of hardcoded.

      Why a SEED and not baked into mart_size_class_temperaments: the mart holds EVERY
      (class, tag) pair on purpose (its header: "TOP-N IS NOT HERE… bake the cut in and
      you can't change it without a rebuild"). The curated cut is presentation and stays
      in the read layer; the seed carries only the LIST + ORDER, never pct_of_class. The
      app filters the untouched mart to these tags — "selecting rows already in a mart",
      which DASHBOARD.md §0 permits — and sorts the heatmap's y-axis by sort_order.

      The five were chosen by cross-class spread of pct_of_class (playful/alert at the
      toy end, energetic in the middle, protective/calm at the giant end) so each class
      reads as a distinct column and the whole grid as a diagonal gradient. Reasoning in
      DECISIONS.md §0; the near-universal tags (intelligent, loyal) are set aside on
      purpose.

    columns:
      - name: temperament
        description: >
          Lowercased + trimmed tag, must match breed_temperaments.temperament EXACTLY
          (the bridge is lowercased+trimmed, so 'Calm' would match nothing and silently
          empty a heatmap row).
        data_tests:
          # A curated INPUT guarded like size_class_bands — NOT the DECISIONS.md §3
          # "wallpaper" anti-pattern. relationships fires if a seed tag is a typo, a
          # casing/normalization mismatch, or drifts out of the vocabulary — each of
          # which blanks a heatmap row. WARN, not error: editing the seed IS the correct
          # response, and M5's annotate_warns.py surfaces it without failing the build.
          - unique
          - relationships:
              to: ref('breed_temperaments')
              field: temperament
              config:
                severity: warn
      - name: sort_order
        description: Heatmap y-axis order (1 = top). playful→calm gives the diagonal.
        data_tests:
          - not_null
          - unique
