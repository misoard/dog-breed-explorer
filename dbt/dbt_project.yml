name: 'dog_breed_explorer'
version: '1.0.0'
config-version: 2

# Which profile in profiles.yml to use. Same name, two targets (dev/prod).
profile: 'dog_breed_explorer'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# A test whose ref() doesn't resolve is DROPPED by dbt with only a warning — it doesn't run,
# the build stays green, and you believe you're covered when you aren't. A test that silently
# doesn't run is worse than no test. This escalates that one event to a hard error.
#
# Deliberately scoped to NodeNotFoundOrDisabled rather than blanket --warn-error: blanket
# escalation would also turn our severity:warn TESTS (assert_metric_shape_known, the three
# distributional guards) into build failures, destroying the warn/error split on purpose.
# Verified: this escalates a typo'd ref to exit 2, and leaves warn-severity tests at exit 0.
flags:
  warn_error_options:
    error:
      - NodeNotFoundOrDisabled

# M4 — the distributional guards' thresholds. One home, not scattered through five SQL files:
# same principle as the size bands living in a seed. These are CONFIG (an expectation about a
# normal run), not DATA (a fact about dogs) — hence vars, not a seed.
#
# Each is "this run looks like a normal run", NOT a logical invariant. That is why every test
# using them is `severity: warn`: the API genuinely adding 40 breeds is legitimate drift, and
# auto-failing a good run is worse than surfacing it for a human to judge.
# TWO guards, not three. Both are RATES, deliberately: a rate doesn't go stale when the
# source grows. The third (expected_breed_count 627 +/-5%) was cut — it needed a
# hand-maintained CONSTANT, and a constant nobody bumps warns forever = wallpaper. It was
# also blind to losing up to 31 breeds. assert_no_breed_lost reconciles raw->gold exactly
# instead, with no constant at all. See DECISIONS.md §3.
vars:
  max_unknown_size_class_pct: 1    # observed 2/627 = 0.32%
  max_lifespan_null_pct: 10        # observed 40/627 = 6.4%

# Materialization + schema are set HERE, per layer — never per model. A model that
# has to know where it lives is a model that can't be moved. See SPEC.md
# "Materialization & schemas".
#
#   staging = view   : a parse/type pass with exactly one consumer (marts). Costs
#                      nothing to rebuild and can never be stale.
#   marts   = table  : the dashboard reads these repeatedly. Build once, so the
#                      read path never re-executes the parser.
#
# dbt CONCATENATES a custom schema onto the target schema, so `staging` -> `main_staging`.
# Writing `main_staging` here would give `main_main_staging`.
models:
  dog_breed_explorer:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
